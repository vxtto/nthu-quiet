name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native discovery helpers
        run: python3 -m unittest discover -s tests -v
      - name: Reversible frontend injection
        run: node --test tests/quiet.test.cjs
